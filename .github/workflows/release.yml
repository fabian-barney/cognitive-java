name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    env:
      CRAP_JAVA_VERSION: 0.5.0

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_TOKEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN_PASSWORD

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          extract_semver() {
            printf '%s\n' "$1" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1
          }
          pom_version="$(extract_semver "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)")"
          chmod +x gradle-plugin/gradlew
          gradle_version="$(extract_semver "$(cd gradle-plugin && ./gradlew -q properties | awk -F': ' '/^version:/ {print $2; exit}')")"
          test -n "${pom_version}"
          test -n "${gradle_version}"
          test "${pom_version}" = "${tag_version}"
          test "${gradle_version}" = "${tag_version}"

      - name: Build cognitive-java CLI
        run: mvn -B -pl cli -am package

      - name: Resolve cognitive-java CLI jar path
        shell: bash
        run: |
          shopt -s nullglob
          jars=(cli/target/cognitive-java-cli-*.jar)
          filtered=()
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-shaded.jar|*original*.jar) ;;
              *) filtered+=("$jar") ;;
            esac
          done
          if [ "${#filtered[@]}" -ne 1 ]; then
            echo "Expected exactly one built CLI jar, found ${#filtered[@]}" >&2
            printf 'Candidates:\n%s\n' "${filtered[@]}" >&2
            exit 1
          fi
          echo "COGNITIVE_CLI_JAR=${filtered[0]}" >> "$GITHUB_ENV"

      - name: Resolve crap-java CLI
        run: >
          mvn -B dependency:copy
          -Dartifact="media.barney:crap-java-cli:${CRAP_JAVA_VERSION}:jar"
          -DoutputDirectory=target/crap-java-gate

      - name: Run Maven-source crap-java gate
        run: |
          mkdir -p target/crap-java
          java -jar target/crap-java-gate/crap-java-cli-${CRAP_JAVA_VERSION}.jar \
            --format text \
            --junit-report target/crap-java/TEST-crap-java-maven-sources.xml \
            --build-tool maven \
            core/src/main/java cli/src/main/java maven-plugin/src/main/java

      - name: Run Gradle-plugin crap-java gate
        run: |
          mkdir -p target/crap-java
          java -jar target/crap-java-gate/crap-java-cli-${CRAP_JAVA_VERSION}.jar \
            --format text \
            --junit-report target/crap-java/TEST-crap-java-gradle-plugin.xml \
            --build-tool gradle \
            gradle-plugin/src/main/java

      - name: Run Maven-source cognitive-java gate
        run: |
          mkdir -p target/cognitive-java
          java -jar "$COGNITIVE_CLI_JAR" \
            --format text \
            --junit-report target/cognitive-java/TEST-cognitive-java-maven-sources.xml \
            core/src/main/java cli/src/main/java maven-plugin/src/main/java

      - name: Run Gradle-plugin cognitive-java gate
        run: |
          mkdir -p target/cognitive-java
          java -jar "$COGNITIVE_CLI_JAR" \
            --format text \
            --junit-report target/cognitive-java/TEST-cognitive-java-gradle-plugin.xml \
            gradle-plugin/src/main/java

      - name: Normalize and import GPG key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          normalized_key="$(mktemp)"
          candidate_key="$(mktemp)"
          temp_files=("$normalized_key" "$candidate_key")
          cleanup() {
            local path
            for path in "${temp_files[@]}"; do
              if [ -n "$path" ] && [ -e "$path" ]; then
                rm -f "$path"
              fi
            done
          }
          trap cleanup EXIT
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" > "$candidate_key"
          import_succeeded=0
          for decode_depth in 0 1 2 3; do
            candidate_home="$(mktemp -d)"
            if GNUPGHOME="$candidate_home" gpg --batch --import "$candidate_key" >/dev/null 2>&1; then
              export GNUPGHOME="$candidate_home"
              echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
              import_succeeded=1
              break
            fi
            next_key="$(mktemp)"
            rm -rf "$candidate_home"
            if ! base64 --decode "$candidate_key" > "$next_key" 2>/dev/null; then
              rm -f "$next_key"
              break
            fi
            rm -f "$candidate_key"
            temp_files+=("$next_key")
            candidate_key="$next_key"
          done
          if [ "$import_succeeded" -ne 1 ]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is not importable as raw or repeatedly base64-decoded OpenPGP private key material after three decode attempts. Ensure the secret contains the private key itself or a base64-wrapped copy of it."
            exit 1
          fi
          gpg --batch --pinentry-mode loopback --passphrase "$MAVEN_GPG_PASSPHRASE" \
            --armor --export-secret-keys > "$normalized_key"
          if [ ! -s "$normalized_key" ]; then
            echo "::error::Failed to export an armored private key after importing MAVEN_GPG_PRIVATE_KEY."
            exit 1
          fi
          while IFS= read -r line; do
            echo "::add-mask::$line"
          done < "$normalized_key"
          gpg_env_delimiter="EOF_$(uuidgen)"
          {
            echo "MAVEN_GPG_PRIVATE_KEY<<${gpg_env_delimiter}"
            cat "$normalized_key"
            echo "${gpg_env_delimiter}"
          } >> "$GITHUB_ENV"

      - name: Validate Maven release artifacts
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease -Dcentral.skipPublishing=true -pl .,cli,maven-plugin -am deploy

      - name: Publish Maven artifacts
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease -pl .,cli,maven-plugin -am deploy

      - name: Publish Gradle plugin artifacts to Maven Central
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        working-directory: gradle-plugin
        run: ./gradlew publishAllPublicationsToCentralPortalOssrhStagingRepository

      - name: Finalize Gradle plugin Maven Central deployment
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        shell: bash
        run: |
          auth="$(printf '%s:%s' "${MAVEN_CENTRAL_TOKEN_USERNAME}" "${MAVEN_CENTRAL_TOKEN_PASSWORD}" | base64 -w 0)"
          curl --fail --request POST \
            --header "Authorization: Bearer ${auth}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/media.barney?publishing_type=automatic"

      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        working-directory: gradle-plugin
        run: ./gradlew publishPlugins -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="${version}" '
            $1 == "##" && $2 == version {
              found = 1
            }
            found {
              if ($1 == "##" && $2 != version) {
                exit
              }
              print
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
