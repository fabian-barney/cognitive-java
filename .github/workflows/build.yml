name: Build

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  maven-verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JDK 17 Ubuntu
            os: ubuntu-latest
            java: "17"
          - name: JDK 21 Ubuntu
            os: ubuntu-latest
            java: "21"
          - name: JDK 25 Ubuntu
            os: ubuntu-latest
            java: "25"
          - name: JDK 17 Windows
            os: windows-latest
            java: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify Maven build
        run: mvn -B verify '-Dcentral.skipPublishing=true'

  gradle-plugin:
    name: Gradle Plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            java: "17"
          - name: Windows
            os: windows-latest
            java: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Package core jar
        run: mvn -B -pl core -am package

      - name: Set up Gradle wrapper permissions
        if: runner.os == 'Linux'
        run: chmod +x gradle-plugin/gradlew

      - name: Run Gradle plugin validation (Linux)
        if: runner.os == 'Linux'
        working-directory: gradle-plugin
        run: ./gradlew test validatePlugins

      - name: Run Gradle plugin validation (Windows)
        if: runner.os == 'Windows'
        working-directory: gradle-plugin
        shell: pwsh
        run: .\gradlew.bat test validatePlugins

  crap-java-gate:
    name: crap-java Gate
    runs-on: ubuntu-latest
    env:
      CRAP_JAVA_VERSION: 0.5.0

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve crap-java CLI
        run: >
          mvn -B dependency:copy
          -Dartifact="media.barney:crap-java-cli:${CRAP_JAVA_VERSION}:jar"
          -DoutputDirectory=target/crap-java-gate

      - name: Package core jar
        run: mvn -B -pl core -am package

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      # The crap-java Gate owns CRAP failures across the full repository scope.
      # The Gradle Plugin job validates plugin behavior separately, but metric
      # failures under gradle-plugin/src/main/java still belong here.
      - name: Run Maven-source crap-java gate
        run: |
          mkdir -p target/crap-java
          java -jar target/crap-java-gate/crap-java-cli-${CRAP_JAVA_VERSION}.jar \
            --format text \
            --junit-report target/crap-java/TEST-crap-java-maven-sources.xml \
            --build-tool maven \
            core/src/main/java cli/src/main/java maven-plugin/src/main/java

      - name: Run Gradle-plugin crap-java gate
        run: |
          mkdir -p target/crap-java
          java -jar target/crap-java-gate/crap-java-cli-${CRAP_JAVA_VERSION}.jar \
            --format text \
            --junit-report target/crap-java/TEST-crap-java-gradle-plugin.xml \
            --build-tool gradle \
            gradle-plugin/src/main/java

      - name: Upload crap-java JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crap-java-junit-reports
          path: target/crap-java/TEST-crap-java-*.xml
          if-no-files-found: ignore

  cognitive-java-gate:
    name: cognitive-java Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build CLI
        run: mvn -B -pl cli -am package

      - name: Resolve cognitive-java CLI jar path
        shell: bash
        run: |
          shopt -s nullglob
          jars=(cli/target/cognitive-java-cli-*.jar)
          filtered=()
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-shaded.jar|*original*.jar) ;;
              *) filtered+=("$jar") ;;
            esac
          done
          if [ "${#filtered[@]}" -ne 1 ]; then
            echo "Expected exactly one built CLI jar, found ${#filtered[@]}" >&2
            printf 'Candidates:\n%s\n' "${filtered[@]}" >&2
            exit 1
          fi
          echo "CLI_JAR=${filtered[0]}" >> "$GITHUB_ENV"

      # Keep the self-hosted cognitive gate split by build tool so this job
      # owns every repository source tree, including gradle-plugin/src/main/java.
      - name: Run Maven-source cognitive-java gate
        run: |
          mkdir -p target/cognitive-java
          java -jar "$CLI_JAR" \
            --format text \
            --junit-report target/cognitive-java/TEST-cognitive-java-maven-sources.xml \
            core/src/main/java cli/src/main/java maven-plugin/src/main/java

      - name: Run Gradle-plugin cognitive-java gate
        run: |
          mkdir -p target/cognitive-java
          java -jar "$CLI_JAR" \
            --format text \
            --junit-report target/cognitive-java/TEST-cognitive-java-gradle-plugin.xml \
            gradle-plugin/src/main/java

      - name: Upload cognitive-java JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognitive-java-junit-reports
          path: target/cognitive-java/TEST-cognitive-java-*.xml
          if-no-files-found: ignore

  publishing-preflight:
    name: Publishing Preflight
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_TOKEN_USERNAME: preflight-token-user
      MAVEN_CENTRAL_TOKEN_PASSWORD: preflight-token-password
      MAVEN_GPG_PASSPHRASE: preflight-passphrase

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_TOKEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN_PASSWORD

      - name: Generate temporary GPG key for signing preflight
        shell: bash
        run: |
          export GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          cat > gpg-batch.txt <<EOF
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: cognitive-java preflight
          Name-Email: preflight@example.com
          Expire-Date: 0
          Passphrase: ${MAVEN_GPG_PASSPHRASE}
          %commit
          EOF
          gpg --batch --pinentry-mode loopback --generate-key gpg-batch.txt
          {
            echo "MAVEN_GPG_PRIVATE_KEY<<EOF"
            gpg --batch --pinentry-mode loopback --passphrase "${MAVEN_GPG_PASSPHRASE}" --armor --export-secret-keys preflight@example.com
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run Maven publishing preflight
        run: mvn -B -Prelease -Dcentral.skipPublishing=true -pl .,cli,maven-plugin -am deploy

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Validate Gradle plugin publication metadata
        working-directory: gradle-plugin
        run: ./gradlew test validatePlugins publishToMavenLocal

      - name: Verify legacy package registry references are gone
        shell: bash
        run: |
          if git grep -n -E 'maven\.pkg\.github\.com|gpr\.user|gpr\.key' -- . ':(exclude).github/workflows/build.yml'; then
            echo "Found banned legacy package-registry references in tracked sources." >&2
            exit 1
          fi
