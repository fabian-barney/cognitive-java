          path: ~/.m2/repository

      - name: Build core jar for SpotBugs gate
        run: mvn -B -ntp -P!quality-gates-all -pl core -am -o -DskipTests package

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Run SpotBugs gate for gradle-plugin
        working-directory: gradle-plugin
        run: ./gradlew spotbugsMain

  quality-spotbugs-maven-plugin:
    name: verify / quality-spotbugs-maven-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Remove Maven plugin IT fixtures from gate workspace
        run: rm -rf maven-plugin/src/it

      - name: Run SpotBugs gate for maven-plugin
        working-directory: maven-plugin
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-spotbugs -o -DskipTests verify

  publishing-preflight:
    name: publish / preflight
    runs-on: ubuntu-latest
    needs:
      - package
      - quality-crap-core
      - quality-crap-cli
      - quality-crap-gradle-plugin
      - quality-crap-maven-plugin
      - quality-cognitive-core
      - quality-cognitive-cli
      - quality-cognitive-gradle-plugin
      - quality-cognitive-maven-plugin
      - quality-nullaway-core
      - quality-nullaway-cli
      - quality-nullaway-gradle-plugin
      - quality-nullaway-maven-plugin
      - quality-spotbugs-core
      - quality-spotbugs-cli
      - quality-spotbugs-gradle-plugin
      - quality-spotbugs-maven-plugin
    env:
      MAVEN_CENTRAL_TOKEN_USERNAME: preflight-token-user
      MAVEN_CENTRAL_TOKEN_PASSWORD: preflight-token-password
      MAVEN_GPG_PASSPHRASE: preflight-passphrase

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          mvn-server-repository-origins: central:https://central.sonatype.com
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_TOKEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN_PASSWORD

      - name: Record reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Generate temporary GPG key for signing preflight
        shell: bash
        run: |
          export GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          bash .github/scripts/gpg-release-sign.sh \
            --faked-system-time "$((SOURCE_DATE_EPOCH - 1))!" \
            --quick-generate-key "cognitive-java preflight <preflight@example.com>" rsa2048 sign 0
          {
            echo "MAVEN_GPG_PRIVATE_KEY<<EOF"
            bash .github/scripts/gpg-release-sign.sh --armor --export-secret-keys preflight@example.com
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Verify release version parity
        shell: bash
        run: bash ./.github/scripts/verify-version-alignment.sh

      - name: Prepare clean Maven release workspace
        shell: bash
        run: |
          # Use a clean local repository so preflight does not inherit reactor-masking artifacts.
          preflight_maven_repo_local="$(mktemp -d)"
          test -n "$preflight_maven_repo_local"
          echo "PREFLIGHT_MAVEN_REPO_LOCAL=${preflight_maven_repo_local}" >> "$GITHUB_ENV"

      - name: Run Maven publishing preflight
        run: >
          mvn -B -ntp
          "-Dmaven.repo.local=${PREFLIGHT_MAVEN_REPO_LOCAL}"
          -P!quality-gates-all,release
          -Dcentral.skipPublishing=true
          "-Dproject.build.outputTimestamp=${SOURCE_DATE_EPOCH}"
          -pl .,cli,maven-plugin -am deploy

      - name: Clean Maven release workspace
        if: always()
        shell: bash
        run: rm -rf "${PREFLIGHT_MAVEN_REPO_LOCAL}"

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Validate Gradle plugin publication metadata
        working-directory: gradle-plugin
        run: ./gradlew test validatePlugins publishToMavenLocal

      - name: Verify archive legal content
        run: |
          java .github/scripts/VerifyLegalContents.java
          python3 .github/scripts/verify-runtime-baseline.py --gradle-metadata gradle-plugin/build/publications/pluginMaven/module.json

      - name: Build signed release asset bundle
        shell: bash
        run: |
          release_assets="${RUNNER_TEMP}/release-assets"
          mkdir "$release_assets"
          bash .github/scripts/build-release-payloads.sh "$release_assets"
          bash .github/scripts/sign-release-assets.sh "$release_assets"
          bash .github/scripts/verify-release-assets.sh "$release_assets" \
            "$(python3 .github/scripts/project-version.py)"
          (cd gradle-plugin && ./gradlew publishToMavenLocal)
          python3 .github/scripts/freeze-publication-artifacts.py \
            "$(python3 .github/scripts/project-version.py)" target/verified-publication \
            --assets-directory "$release_assets"

      - name: Verify legacy package registry references are gone
        shell: bash
        run: |
          if git grep -n -E 'maven\.pkg\.github\.com|gpr\.user|gpr\.key' -- . ':(exclude).github/workflows/build.yml'; then
            echo "Found banned legacy package-registry references in tracked sources." >&2
            exit 1
          fi

  compatibility-maven:
    name: compatibility / ${{ matrix.os }} / Maven ${{ matrix.maven }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        maven: [ "3.9.16", "3.10.0" ]
        java: [ "21", "25" ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Maven ${{ matrix.maven }}
        uses: ./.github/actions/setup-maven
        with:
          version: ${{ matrix.maven }}

      - name: Verify selected toolchain
        shell: bash
        env:
          MAVEN_VERSION: ${{ matrix.maven }}
        run: |
          java -version
          mvn_version="$(mvn --version | head -n 1)"
          echo "$mvn_version"
          [[ "$mvn_version" == "Apache Maven ${MAVEN_VERSION}"* ]]

      - name: Run CLI and Maven plugin functional tests
        run: mvn -B -ntp clean verify

      - name: Verify Java 21 bytecode
        shell: bash
        run: |
          javap -verbose -classpath core/target/classes media.barney.cognitive.core.CognitiveComplexityAnalyzer \
            | grep --fixed-strings "major version: 65"

  compatibility-gradle:
    name: compatibility / ${{ matrix.os }} / Gradle ${{ matrix.gradle }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        gradle: [ "8.14.6", "9.8.2" ]
        java: [ "21", "25" ]
        exclude:
          - gradle: "8.14.6"
            java: "25"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Build Java 21 core artifact
        run: mvn --version && mvn -B -ntp -P!quality-gates-all -pl core -am -DskipTests package

      - name: Verify Windows wrapper exit codes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-gradle-wrapper.ps1

      - name: Run Gradle plugin functional tests
        working-directory: gradle-plugin
        run: gradle --version && gradle clean check validatePlugins

      - name: Show failing Gradle test diagnostics
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('gradle-plugin/build/test-results/test').glob('TEST-*.xml'):
              for case in ET.parse(path).findall('.//testcase'):
                  for failure in case.findall('failure'):
                      print(case.get('name'), failure.text)
          PY

  reproducibility:
    name: verify / reproducible-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Compare two clean release builds
        shell: bash
        run: |
          repository_root="${GITHUB_WORKSPACE}"
          source_date_epoch="$(git -C "$repository_root" show -s --format=%ct HEAD)"
          reproducibility_root="$(mktemp -d)"
          export GNUPGHOME="$(mktemp -d)"
          export MAVEN_GPG_PASSPHRASE=reproducibility-only
          bash .github/scripts/gpg-release-sign.sh \
            --faked-system-time "$((source_date_epoch - 1))!" \
            --quick-generate-key "cognitive-java reproducibility <reproducibility@example.com>" \
            rsa2048 sign 0
          for build_name in first second; do
            build_root="${reproducibility_root}/${build_name}"
            mkdir "$build_root"
            git -C "$repository_root" archive HEAD | tar -x -C "$build_root"
            (
              cd "$build_root"
              export SOURCE_DATE_EPOCH="$source_date_epoch"
              bash .github/scripts/build-release-payloads.sh target/release-assets
              bash .github/scripts/sign-release-assets.sh target/release-assets
              version="$(python3 .github/scripts/project-version.py)"
              bash .github/scripts/verify-release-assets.sh target/release-assets "$version"
              find core/target cli/target maven-plugin/target gradle-plugin/build/libs target/release-assets \
                -maxdepth 1 -type f \
                \( -name '*.jar' -o -name '*.cdx.json' \
                  -o -name 'SHA256SUMS' -o -name 'SHA512SUMS' \) -print0 \
                | LC_ALL=C sort -z | xargs -0 sha256sum > release-digests.sha256
            )
          done
          diff --unified "${reproducibility_root}/first/release-digests.sha256" \
            "${reproducibility_root}/second/release-digests.sha256"

  sbom-tests:
    name: verify / SBOM contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify deterministic identities and embedded component inventories
        run: |
          python3 -B .github/scripts/test-runtime-baseline.py
          python3 -B .github/scripts/test-sbom-normalization.py
          python3 -B .github/scripts/test-component-sboms.py

  required:
    name: verify / required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - release-controls
      - wrapper-validation
      - build
      - test-unit
      - package
      - quality-crap-core
      - quality-crap-cli
      - quality-crap-gradle-plugin
      - quality-crap-maven-plugin
      - quality-cognitive-core
      - quality-cognitive-cli
      - quality-cognitive-gradle-plugin
      - quality-cognitive-maven-plugin
      - quality-nullaway-core
      - quality-nullaway-cli
      - quality-nullaway-gradle-plugin
      - quality-nullaway-maven-plugin
      - quality-spotbugs-core
      - quality-spotbugs-cli
      - quality-spotbugs-gradle-plugin
      - quality-spotbugs-maven-plugin
      - publishing-preflight
      - compatibility-maven
      - compatibility-gradle
      - reproducibility
      - sbom-tests

    steps:
      - name: Require every compatibility, quality, packaging, and release control check
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['GATE_RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failures:
              raise SystemExit(f'Required checks did not succeed: {failures}')
          print(f'All {len(results)} required job groups passed.')
          PY
