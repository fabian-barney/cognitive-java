name: CI

on:
  pull_request:
  push:
    branches: [ main, "release/hotfix/*" ]

permissions:
  contents: read

jobs:
  release-controls:
    name: verify / release controls / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test release source and version controls
        shell: bash
        run: bash .github/scripts/test-release-controls.sh

      - name: Test registry collision handling
        run: python -B .github/scripts/test-release-collisions.py

  wrapper-validation:
    name: verify / Gradle wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B -ntp -P!quality-gates-all -DskipTests install

      - name: Prime Maven test cache
        run: |
          mvn -B -ntp -P!quality-gates-all,quality-gate-spotbugs -DskipTests -DincludePluginDependencies=true org.apache.maven.plugins:maven-dependency-plugin:3.7.0:go-offline
          junit_version="$(mvn -B -ntp -N -P!quality-gates-all help:evaluate -Dexpression=junit.version -q -DforceStdout | tail -n 1)"
          surefire_version="$(mvn -B -ntp -N -P!quality-gates-all help:evaluate -Dexpression=maven.surefire.plugin.version -q -DforceStdout | tail -n 1)"
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.7.0:get -Dartifact="org.junit.platform:junit-platform-engine:${junit_version}"
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.7.0:get -Dartifact="org.junit.platform:junit-platform-launcher:${junit_version}"
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.7.0:get -Dartifact="org.apache.maven.surefire:surefire-junit-platform:${surefire_version}" -Dtransitive=true

      - name: Upload Maven repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-repository
          path: ~/.m2/repository
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run unit tests
        run: mvn -B -ntp -P!quality-gates-all -o verify

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: |
            core/target/site/jacoco
            cli/target/site/jacoco
            gradle-plugin/target/site/jacoco
            maven-plugin/target/site/jacoco
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run package build
        run: mvn -B -ntp -P!quality-gates-all -o -DskipTests package

  quality-crap-core:
    name: verify / quality-crap-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for core
        working-directory: core
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-crap-cli:
    name: verify / quality-crap-cli
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for cli
        working-directory: cli
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-crap-gradle-plugin:
    name: verify / quality-crap-gradle-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Build core jar for gradle-plugin gate
        run: mvn -B -ntp -P!quality-gates-all -pl core -am -DskipTests package

      - name: Resolve crap-java CLI
        shell: bash
        run: |
          crap_java_version="$(mvn -q -N help:evaluate '-Dexpression=crap-java.version' -DforceStdout)"
          test -n "$crap_java_version"
          mvn -B -ntp -N dependency:copy \
            -Dartifact="media.barney:crap-java-cli:${crap_java_version}:jar" \
            -DoutputDirectory=target/crap-java-gate
          echo "CRAP_JAVA_VERSION=${crap_java_version}" >> "$GITHUB_ENV"

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Run crap-java gate for gradle-plugin
        run: |
          mkdir -p target/crap-java
          java -jar "target/crap-java-gate/crap-java-cli-${CRAP_JAVA_VERSION}.jar" \
            --format none \
            --junit-report target/crap-java/TEST-crap-java-gradle-plugin.xml \
            --build-tool gradle \
            gradle-plugin/src/main/java

  quality-crap-maven-plugin:
    name: verify / quality-crap-maven-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
