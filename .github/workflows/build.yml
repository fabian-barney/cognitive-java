name: CI

on:
  pull_request:
  push:
    branches: [ main, "release/hotfix/*" ]

permissions:
  contents: read

jobs:
  release-controls:
    name: verify / release controls / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release source and version controls
        shell: bash
        run: bash .github/scripts/test-release-controls.sh

      - name: Test registry collision handling
        run: python -B .github/scripts/test-release-collisions.py

  wrapper-validation:
    name: verify / Gradle wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -ntp -P!quality-gates-all -DskipTests install

      - name: Prime Maven test cache
        run: |
          mvn -B -ntp -P!quality-gates-all,quality-gate-spotbugs -DskipTests -DincludePluginDependencies=true org.apache.maven.plugins:maven-dependency-plugin:3.11.0:go-offline
          junit_version="$(mvn -B -ntp -N -P!quality-gates-all help:evaluate -Dexpression=junit.version -q -DforceStdout | tail -n 1)"
          surefire_version="$(mvn -B -ntp -N -P!quality-gates-all help:evaluate -Dexpression=maven.surefire.plugin.version -q -DforceStdout | tail -n 1)"
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get -Dartifact="org.junit.platform:junit-platform-engine:${junit_version}"
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get -Dartifact="org.junit.platform:junit-platform-launcher:${junit_version}"
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get -Dartifact="org.apache.maven.surefire:surefire-junit-platform:${surefire_version}" -Dtransitive=true

      - name: Upload Maven repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-repository
          path: ~/.m2/repository
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run unit tests
        run: mvn -B -ntp -P!quality-gates-all -o verify

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-reports
          path: |
            core/target/site/jacoco
            cli/target/site/jacoco
            gradle-plugin/target/site/jacoco
            maven-plugin/target/site/jacoco
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run package build
        run: mvn -B -ntp -P!quality-gates-all -o -DskipTests package

  quality-crap-core:
    name: verify / quality-crap-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for core
        working-directory: core
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-crap-cli:
    name: verify / quality-crap-cli
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for cli
        working-directory: cli
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-crap-gradle-plugin:
    name: verify / quality-crap-gradle-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Build core jar for gradle-plugin gate
        run: mvn --version && mvn -B -ntp -P!quality-gates-all -pl core -am -DskipTests package

      - name: Resolve crap-java CLI
        shell: bash
        run: |
          crap_java_version="$(mvn -q -N help:evaluate '-Dexpression=crap-java.version' -DforceStdout)"
          test -n "$crap_java_version"
          mvn -B -ntp -N dependency:copy \
            -Dartifact="media.barney:crap-java-cli:${crap_java_version}:jar" \
            -DoutputDirectory=target/crap-java-gate
          echo "CRAP_JAVA_VERSION=${crap_java_version}" >> "$GITHUB_ENV"

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Run crap-java gate for gradle-plugin
        run: |
          mkdir -p target/crap-java
          java -jar "target/crap-java-gate/crap-java-cli-${CRAP_JAVA_VERSION}.jar" \
            --format none \
            --junit-report target/crap-java/TEST-crap-java-gradle-plugin.xml \
            --build-tool gradle \
            gradle-plugin/src/main/java

  quality-crap-maven-plugin:
    name: verify / quality-crap-maven-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Maven 3.10.0
        uses: ./.github/actions/setup-maven

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
