name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B -ntp -P!quality-gates-all -DskipTests install

      - name: Upload Maven repository
        uses: actions/upload-artifact@v7
        with:
          name: maven-repository
          path: ~/.m2/repository
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run unit tests
        run: mvn -B -ntp -P!quality-gates-all -o verify

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            core/target/site/jacoco
            cli/target/site/jacoco
            gradle-plugin/target/site/jacoco
            maven-plugin/target/site/jacoco
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run package build
        run: mvn -B -ntp -P!quality-gates-all -o -DskipTests package

  quality-crap-core:
    name: verify / quality-crap-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for core
        working-directory: core
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-crap-cli:
    name: verify / quality-crap-cli
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for cli
        working-directory: cli
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-crap-gradle-plugin:
    name: verify / quality-crap-gradle-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Build core jar for gradle-plugin gate
        run: mvn -B -ntp -P!quality-gates-all -pl core -am -DskipTests package

      - name: Resolve crap-java CLI
        shell: bash
        run: |
          crap_java_version="$(sed -n 's:.*<crap-java.version>\(.*\)</crap-java.version>.*:\1:p' pom.xml | head -n 1)"
          test -n "$crap_java_version"
          mvn -B -ntp dependency:copy \
            -Dartifact="media.barney:crap-java-cli:${crap_java_version}:jar" \
            -DoutputDirectory=target/crap-java-gate
          echo "CRAP_JAVA_VERSION=${crap_java_version}" >> "$GITHUB_ENV"

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Run crap-java gate for gradle-plugin
        run: |
          mkdir -p target/crap-java
          java -jar "target/crap-java-gate/crap-java-cli-${CRAP_JAVA_VERSION}.jar" \
            --format none \
            --junit-report target/crap-java/TEST-crap-java-gradle-plugin.xml \
            --build-tool gradle \
            gradle-plugin/src/main/java

  quality-crap-maven-plugin:
    name: verify / quality-crap-maven-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Remove Maven plugin IT fixtures from gate workspace
        run: rm -rf maven-plugin/src/it

      - name: Run crap-java gate for maven-plugin
        working-directory: maven-plugin
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-cognitive-core:
    name: verify / quality-cognitive-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run cognitive-java gate for core
        working-directory: core
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-cognitive -DskipTests verify

  quality-cognitive-cli:
    name: verify / quality-cognitive-cli
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run cognitive-java gate for cli
        working-directory: cli
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-cognitive -DskipTests verify

  quality-cognitive-gradle-plugin:
    name: verify / quality-cognitive-gradle-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run cognitive-java gate for gradle-plugin
        working-directory: gradle-plugin
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-cognitive -DskipTests verify

  quality-cognitive-maven-plugin:
    name: verify / quality-cognitive-maven-plugin
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Remove Maven plugin IT fixtures from gate workspace
        run: rm -rf maven-plugin/src/it

      - name: Run cognitive-java gate for maven-plugin
        working-directory: maven-plugin
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-cognitive -DskipTests verify

  publishing-preflight:
    name: publish / preflight
    runs-on: ubuntu-latest
    needs:
      - package
      - quality-crap-core
      - quality-crap-cli
      - quality-crap-gradle-plugin
      - quality-crap-maven-plugin
      - quality-cognitive-core
      - quality-cognitive-cli
      - quality-cognitive-gradle-plugin
      - quality-cognitive-maven-plugin
    env:
      MAVEN_CENTRAL_TOKEN_USERNAME: preflight-token-user
      MAVEN_CENTRAL_TOKEN_PASSWORD: preflight-token-password
      MAVEN_GPG_PASSPHRASE: preflight-passphrase

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_TOKEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN_PASSWORD

      - name: Generate temporary GPG key for signing preflight
        shell: bash
        run: |
          export GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          cat > gpg-batch.txt <<EOF
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: cognitive-java preflight
          Name-Email: preflight@example.com
          Expire-Date: 0
          Passphrase: ${MAVEN_GPG_PASSPHRASE}
          %commit
          EOF
          gpg --batch --pinentry-mode loopback --generate-key gpg-batch.txt
          {
            echo "MAVEN_GPG_PRIVATE_KEY<<EOF"
            gpg --batch --pinentry-mode loopback --passphrase "${MAVEN_GPG_PASSPHRASE}" --armor --export-secret-keys preflight@example.com
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run Maven publishing preflight
        run: mvn -B -Prelease -Dcentral.skipPublishing=true -pl .,cli,maven-plugin -am deploy

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Validate Gradle plugin publication metadata
        working-directory: gradle-plugin
        run: ./gradlew test validatePlugins publishToMavenLocal

      - name: Verify legacy package registry references are gone
        shell: bash
        run: |
          if git grep -n -E 'maven\.pkg\.github\.com|gpr\.user|gpr\.key' -- . ':(exclude).github/workflows/build.yml'; then
            echo "Found banned legacy package-registry references in tracked sources." >&2
            exit 1
          fi
